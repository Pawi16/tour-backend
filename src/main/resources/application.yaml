server:
  shutdown: graceful

spring:
    application:
        name: tour-go
    threads:
        virtual:
            enabled: true
    mvc:
      problemdetails:
        enabled: true
    # Database connection
    datasource:
      url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tour}
      username: ${DATABASE_USER:myuser}
      password: ${DATABASE_PASSWORD:secret}
      hikari:
        maximum-pool-size: ${POOL_SIZE:10}
    # Database migraiton
    flyway:
      enabled: ${FLYWAY_ENABLED:true}
      baseline-on-migrate: ${IS_FLYWAY_BASELINE_ON_MIGRATE:true}
      validate-on-migrate: ${IS_FLYWAY_VALIDATE_ON_MIGRATE:true}
      locations:
      - classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus, metrics"
